services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      RATE_LIMIT: ${RATE_LIMIT:-5}
      RATE_WINDOW_MS: ${RATE_WINDOW_MS:-60000}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      RATE_LIMIT_ON_REDIS_ERROR: ${RATE_LIMIT_ON_REDIS_ERROR:-closed}
      REDIS_URL: ${REDIS_URL:-}
      RATE_LIMIT_REDIS_PREFIX: ${RATE_LIMIT_REDIS_PREFIX:-tf:fw:v1}
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      THROTTLEFORGE_API_ORIGIN: http://api:3000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      THROTTLEFORGE_SITE_ADDRESS: ${THROTTLEFORGE_SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
